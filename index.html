<title>Pro Hockey: Career Mode</title>
<style>

*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 78% 0,#253f57 0,transparent 55%),linear-gradient(125deg,#060e1a,#0b1b2d 65%,#06101b);color:var(--ice);font:16px/1.5 system-ui,sans-serif}

header{border-bottom:1px solid #627d96;background:linear-gradient(105deg,#121d2d,#28445c 56%,#0d1724);box-shadow:0 6px 26px #0005}.top{max-width:1190px;margin:auto;padding:.8rem clamp(.8rem,3vw,2rem);display:flex;justify-content:space-between;align-items:center;gap:.75rem}.brand{font-size:clamp(1rem,3vw,1.58rem);font-weight:950;font-style:italic;letter-spacing:.08em;line-height:1.1;text-transform:uppercase}.brand small{display:block;font:800 .73rem/1.6 system-ui;color:var(--gold);letter-spacing:.2em}main{max-width:1190px;margin:auto;padding:clamp(.8rem,3vw,2rem);min-height:72vh}
h1,h2,h3,p{margin:0}h1,h2,h3{line-height:1.12}h1{font-size:clamp(2rem,6vw,4.4rem);letter-spacing:-.055em;text-transform:uppercase;font-weight:950;font-style:italic}h2{font-size:clamp(1.4rem,3.8vw,2.2rem);letter-spacing:-.03em}h3{font-size:1.12rem}p{margin:.55rem 0}.muted{color:var(--muted)}.eyebrow{color:var(--blue);font-size:.78rem;font-weight:850;letter-spacing:.16em;text-transform:uppercase;margin:0 0 .4rem}.gold-text{color:var(--gold)}.good{color:var(--green)}.bad{color:var(--red)}.section-head{margin-bottom:1rem}.stack{display:grid;gap:1rem}.row{display:flex;flex-wrap:wrap;gap:.65rem;align-items:center}.spread{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,225px),1fr));gap:.8rem}.panel{background:linear-gradient(135deg,#1c3147ed,#0e1b2cec);border:1px solid var(--edge);border-top-color:#66819a;box-shadow:0 12px 32px #0004,inset 0 1px #ffffff10;border-radius:8px;padding:clamp(.8rem,2vw,1.25rem);position:relative}.panel h3+ p{margin-top:.45rem}

.nav{display:flex;gap:.4rem;overflow:auto;margin-bottom:1rem;padding:2px 2px 5px}.nav button{white-space:nowrap;flex:1}.nav [aria-current]{border-color:var(--gold);color:var(--gold)}.dashboard{display:grid;grid-template-columns:minmax(240px,370px) 1fr;gap:1rem}.card{--tier:#dfa571;position:relative;overflow:hidden;min-height:405px;border:2px solid var(--tier);border-radius:12px;background:#091827;box-shadow:0 10px 40px #0006,inset 0 0 30px var(--tier)}.card canvas.portrait{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.card:after{position:absolute;inset:30% 0 0;content:"";pointer-events:none;background:linear-gradient(transparent,#06101be0 80%,#060f19)}.card-top,.card-bottom{position:absolute;z-index:1;left:1rem;right:1rem}.card-top{top:.85rem}.card-bottom{bottom:1rem}.card-bottom h2{font-style:italic;text-transform:uppercase;overflow-wrap:anywhere}.rating{color:var(--tier);font-size:3.3rem;font-weight:950;line-height:.85;text-align:right;text-shadow:2px 2px 8px #07111b}.rating small{display:block;font:900 .72rem system-ui;letter-spacing:.18em}.rank{color:var(--tier);font-weight:850;text-transform:uppercase;letter-spacing:.14em}.card[data-tier="3"]{box-shadow:0 0 20px #a6a8ff40,inset 0 0 24px #e9a8ff}.card[data-tier="4"]{animation:legend 2.6s ease-in-out infinite alternate}@keyframes legend{to{box-shadow:0 0 28px #f2be6588,inset 0 0 34px #ffcb75}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-top:.8rem}.stat{background:#081625a0;border:1px solid #344e67;border-top:2px solid #78a1bb;border-radius:5px;padding:.45rem;text-align:center}.stat strong{display:block;font-size:clamp(1.2rem,3vw,1.9rem);font-variant-numeric:tabular-nums}.stat small{color:var(--muted);font-size:.77rem}.track{height:.45rem;background:#06101c;border-radius:9px;overflow:hidden;margin:.35rem 0}.track i{display:block;height:100%;background:linear-gradient(90deg,#4986bf,#93e7ff);border-radius:9px}.track.energy i{background:linear-gradient(90deg,#50a688,#a9f1c9)}

margin:auto;padding:.7rem}.goalmouth button{min-height:60px}.goalmouth .target{background:#f5cb64;color:#182336;border-color:#603e03;box-shadow:0 0 12px #dad334}.meter{height:1.75rem;position:relative;background:#10283d;border:1px solid #8aa8bc;border-radius:4px;overflow:hidden}.meter-zone,.meter-cursor{position:absolute;top:0;bottom:0}.meter-zone{background:#64d8ac}.meter-cursor{width:5px;background:white;box-shadow:0 0 5px #061326}.trophy{font-size:2.2rem}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}td,th{padding:.45rem;text-align:left;border-bottom:1px solid #37516b}th{color:var(--blue)}tr.mine{color:var(--gold);font-weight:850}.notice{min-height:1.4rem;color:var(--gold)}.card[data-tier="3"]:before{content:"";position:absolute;z-index:1;inset:0;pointer-events:none;background:linear-gradient(125deg,transparent 15%,#ab8aff32 34%,#8fe7ff30 42%,#ffb3c332 48%,transparent 62%);mix-blend-mode:screen}footer{color:var(--muted);text-align:center;padding:1rem;font-size:.85rem}

.jersey-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:.7rem;align-items:end}
.jersey-form input[type=color]{padding:.25rem;cursor:pointer}
.celebration-scene{margin:0;min-height:117px;background:radial-gradient(ellipse at 50% 100%,#658caa55,transparent 64%),linear-gradient(#0b1726,#1e3c55);display:grid;justify-items:center;align-content:center;overflow:hidden;border:1px solid var(--edge);border-radius:6px}
.celebration-scene figcaption{padding:0 0 .45rem;color:var(--gold);font-weight:900}
.celebration-scene.recap canvas{animation:jump .72s ease-out both}
.celebration-scene.arrow.recap canvas{animation:arrow-pose .9s ease-out both}
.celebration-scene.slide.recap canvas{animation:ice-slide .9s ease-out both}
.celebration-scene.shuffle.recap canvas{animation:shuffle-step .48s ease-in-out 3}
@keyframes jump{0%{transform:translateY(12px) scale(.75)}40%{transform:translateY(-12px)}100%{transform:none}}
@keyframes arrow-pose{0%{transform:translateX(-42px) rotate(-22deg);opacity:.5}55%{transform:translateX(5px) rotate(6deg)}100%{transform:none}}
@keyframes ice-slide{0%{transform:translateX(-180px) rotate(-9deg)}100%{transform:none}}
@keyframes shuffle-step{0%,100%{transform:none}25%{transform:translateX(16px) rotate(10deg)}75%{transform:translateX(-16px) rotate(10deg)}}
.race-list{padding-left:1.55rem;margin:.65rem 0 .1rem}.race-list li{padding:.35rem 0;border-bottom:1px solid #3a5067}
.race-row{display:flex;gap:.5rem;justify-content:space-between;align-items:baseline}.race-row strong{white-space:nowrap;font-size:.82rem}
.race-grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,285px),1fr))}
.award-card.you-won{border-color:var(--gold);box-shadow:0 0 20px #f4ca6926}
.locker-scene{--fixture:#617286;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(.5rem,2vw,1.2rem);align-items:end;overflow:hidden;background:repeating-linear-gradient(90deg,#091727 0 18%,#273c52 18% 18.5%,#091727 18.5% 19%),#102238}
.locker-scene[data-level="1"]{--fixture:#88e8ff;background:radial-gradient(ellipse at 25% 0,#486c8b,#091727 65%)}
.locker-scene[data-level="2"]{--fixture:#d4e5f5;background:linear-gradient(120deg,#121e2d,#334c63 55%,#121e2d)}
.locker-scene[data-level="3"]{--fixture:#ffd772;background:radial-gradient(ellipse at 50% 0,#735733 0,#2b3040 36%,#0a1624 70%);border-color:#d4a557}

.locker-jersey{width:min(80%,200px);height:clamp(86px,15vw,150px);margin:1.1rem auto .3rem;display:grid;place-items:center;clip-path:polygon(30% 0,41% 0,50% 13%,59% 0,70% 0,100% 22%,92% 61%,75% 53%,75% 100%,25% 100%,25% 53%,8% 61%,0 22%);background:linear-gradient(0deg,var(--club) 0 12%,var(--trim) 12% 20%,var(--club) 20%);font-style:italic;font-weight:950;font-size:clamp(1.8rem,5vw,3.7rem);color:var(--trim);text-shadow:1px 1px 3px #000,-1px -1px 3px #000}
.stall p{font-size:.8rem;color:var(--fixture)}
.locker-wall{display:grid;justify-items:center;min-width:0}.locker-poster,.locker-hook{position:relative;width:min(100%,200px);height:clamp(100px,19vw,190px);margin:.6rem 0;background:#050d18;border:3px solid var(--fixture);box-shadow:0 5px 15px #0009;overflow:hidden}
.locker-poster canvas{width:100%;height:100%;object-fit:cover;opacity:.88}
.locker-poster figcaption{position:absolute;inset:auto 0 0;padding:.35rem;background:#061323e0;border-top:2px solid var(--poster);text-align:center;font-size:clamp(.62rem,2vw,1rem);font-weight:900;color:var(--poster);text-transform:uppercase}
.locker-hook{display:grid;place-items:center;border-style:dashed;color:var(--muted);text-align:center;font-size:.82rem}
.locker-shelf{width:100%;min-height:50px;padding:.3rem;display:flex;flex-wrap:wrap;justify-content:center;align-items:end;gap:.25rem .65rem;border-bottom:7px solid var(--fixture);border-radius:4px;background:#07132180;text-align:center}
.locker-scene[data-level="2"] .locker-shelf,.locker-scene[data-level="3"] .locker-shelf{background:linear-gradient(45deg,#091929 45%,#bfdfff46 48%,#bceaff4a 64%,#102234 69%);border:2px solid var(--fixture);border-bottom-width:7px}
.shelf-trophy{font-size:1.25rem;white-space:nowrap}
.match-faceoff,.postgame-head{position:relative;overflow:hidden;background:linear-gradient(105deg,color-mix(in srgb,var(--home) 38%,#091728),#0b1625 50%,color-mix(in srgb,var(--away) 38%,#091728));border:1px solid #7298b167;border-radius:8px;padding:clamp(.6rem,2vw,1.15rem)}
.match-faceoff:before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(115deg,transparent 0 18px,#bfdfff10 19px 20px)}
.match-faceoff .scoreboard{position:relative}.broadcast-shell{max-width:1150px;margin:auto;gap:.7rem}
.broadcast-score{position:sticky;top:0;z-index:3;display:flex;justify-content:center;gap:.55rem;align-items:stretch;background:#081728f2;border:1px solid #4b6a83;border-radius:7px;padding:.35rem;box-shadow:0 6px 22px #0007}
.broadcast-teams{display:grid;grid-template-columns:1fr 1fr;gap:.25rem;min-width:0}
.broadcast-team{background:linear-gradient(120deg,color-mix(in srgb,var(--team) 60%,#0c1928),#12253a);border-left:3px solid var(--team);display:flex;align-items:center;gap:.45rem;padding:.1rem .45rem;min-width:0}

.broadcast-team b{font-size:1.57rem;min-width:1.6rem;margin-inline-start:auto;text-align:center;font-variant-numeric:tabular-nums}
.broadcast-period{align-self:center;color:var(--gold);font-size:clamp(.74rem,2vw,.92rem);white-space:nowrap;font-weight:850;text-transform:uppercase}
.broadcast-team.scored b{animation:score-pop .48s ease-out both}
@keyframes score-pop{0%{transform:scale(.76);color:#ffcf67}55%{transform:scale(1.2);color:#ffcf67}100%{transform:none}}
.broadcast-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(230px,27%);gap:.65rem;align-items:start}
.rink-stage{position:relative;min-width:0;overflow:hidden;border:1px solid #7199b6;border-radius:7px;background:#091a2c;isolation:isolate;box-shadow:0 10px 25px #0004}
.broadcast-rink{display:block;width:100%;height:auto;aspect-ratio:960/420}
.rink-chip,.rink-result{position:absolute;z-index:1;background:linear-gradient(110deg,#173650,#0c1927);border:1px solid #8dbcdb;border-left:4px solid var(--gold);color:#f0f7ff;text-transform:uppercase;letter-spacing:.06em;font-weight:900;font-size:clamp(.7rem,1.8vw,.98rem);padding:.35rem .6rem}
.rink-chip{top:.55rem;left:.55rem}.rink-result{left:50%;bottom:.65rem;transform:translateX(-50%);white-space:nowrap}

.broadcast-feed{grid-column:2;grid-row:1 / span 2 ;padding:.8rem}.broadcast-feed h3{margin-bottom:.5rem}
.broadcast-feed .feed{max-height:395px;min-height:84px;font-size:.92rem}
.broadcast-controls{grid-column:1;padding:.7rem}.broadcast-controls .stack{gap:.48rem}.broadcast-controls p{margin:.25rem 0}
.broadcast-lanes.goalmouth{max-width:none;border:0;background:none;padding:0;gap:.4rem}
.broadcast-lanes button{min-height:45px}.broadcast-lanes .target{outline:2px solid #fff1b0;outline-offset:-4px}
#moment-clock{float:right;margin:0 .3rem 0 .5rem;font-variant-numeric:tabular-nums}
.postgame{max-width:1100px;margin:auto}.postgame-head>h2{margin:.45rem 0;font-size:clamp(1.4rem,4vw,2.9rem)}
.postgame-head .scoreboard{max-width:510px;margin:auto}.postgame-head .score{font-size:clamp(2.2rem,5vw,4rem)}.postgame-head .crest{width:60px;height:60px}
.postgame-grid{display:grid;grid-template-columns:minmax(230px,.85fr) minmax(0,1.3fr);gap:.75rem}
.feature-star{display:flex;gap:.65rem;align-items:center;margin:.7rem 0;padding:.4rem;background:linear-gradient(110deg,#263d56,#101c2a);border:1px solid #d8b96875;border-radius:5px;animation:reveal-card .46s ease-out both}
.feature-star strong{font-size:clamp(1rem,2.5vw,1.4rem)}.feature-star .crest{width:54px;height:54px}
.postgame-stars ol{margin:.6rem 0 .3rem;padding-left:1.5rem}.postgame-stats .stat strong{font-size:clamp(1.05rem,3vw,1.85rem)}
.milestone-card{border:1px solid #efc669;background:linear-gradient(115deg,#543915,#17283b 72%);animation:reveal-card .48s ease-out both}

.draft-stage{min-height:290px;display:grid;grid-template-columns:1fr minmax(130px,38%);gap:1rem;align-items:center;overflow:hidden;background:repeating-linear-gradient(115deg,#d2eaff08 0 1px,transparent 1px 18px),linear-gradient(105deg,#0b1727 32%,color-mix(in srgb,var(--club) 39%,#0b1727));border-top:3px solid var(--trim);padding:clamp(1rem,4vw,2.4rem)}
.draft-copy h2{font-size:clamp(1.5rem,5vw,3.4rem)}.draft-copy p{margin:.55rem 0 .9rem}.draft-copy .eyebrow{margin:0 0 .4rem}
.draft-emblem{min-height:145px;display:grid;place-items:center}.draft-emblem .crest{width:min(90%,190px);height:auto;filter:drop-shadow(0 9px 24px #85c8ff48);animation:crest-reveal .65s ease-out both}

.fitting-room{display:grid;grid-template-columns:minmax(120px,255px) minmax(0,1fr);gap:clamp(.6rem,2vw,1.4rem);align-items:center;background:linear-gradient(115deg,#183c57,#0d1c2c)}
.fitting-player{overflow:hidden;border:1px solid #56758b;background:#0b1928;border-radius:6px}.fitting-player canvas{display:block;width:100%;height:auto}
.gear-art{display:block;width:100%;height:auto;border:1px solid #3f6079;border-radius:5px;margin-bottom:.55rem}

.locker-scene{min-height:300px;box-shadow:inset 0 -24px 0 #0d1725,inset 0 -28px 0 #54667b30;align-items:stretch;padding-bottom:2.15rem}
.locker-scene .stall{align-self:stretch}.locker-scene .locker-jersey{box-shadow:0 13px 12px #000a}.locker-scene[data-level="0"] .locker-name,.locker-scene[data-level="0"] .stall p{color:#b4c9dc}
.locker-wall{align-content:end;gap:.6rem}.locker-shelf{min-height:54px;display:grid;box-shadow:0 6px 13px #0007}.shelf-items{display:flex;flex-wrap:wrap;align-items:end;justify-content:center;gap:.7rem}
.locker-scene[data-level="2"] .locker-shelf,.locker-scene[data-level="3"] .locker-shelf{min-height:92px;position:relative;align-items:end;border:4px solid var(--fixture);border-bottom-width:9px;background:linear-gradient(#9ac5df55,#293d4c40 60%,#081726)}
.locker-scene[data-level="2"] .locker-shelf::before,.locker-scene[data-level="3"] .locker-shelf::before{content:"";position:absolute;inset:0;background:linear-gradient(125deg,transparent 36%,#cfefff23 37% 53%,transparent 54% 64%,#d9f4ff2b 65% 67%,transparent 68%);pointer-events:none}

const imageCache=new Map(), jerseyCache=new Map();
function studioImage(key,css='',priority='lazy'){
 return '<img class="'+css+'" src="data:image/webp;base64,'+studioArt[key]+'" alt="" loading="'+priority+'" decoding="async" draggable="false">';
}
function loadStudioImage(key){
 if(!imageCache.has(key)){
  imageCache.set(key,new Promise((resolve,reject)=>{
   const img=new Image();
   img.onload=()=>resolve(img);
   img.onerror=reject;
   img.src='data:image/webp;base64,'+studioArt[key];
  }));
 }
 return imageCache.get(key);
}
function paintPlayerPhoto(canvas,palette=playerPalette(),preview=null){
 const role=isGoalie()?'goalie':'skater';
 const items=equippedKit().map(item=>item.slot===preview?.slot?preview:item);
 const number=career.number;
 const stamp=[role,number,palette.color,palette.accent,...items.map(item=>item.id)].join('/');
 canvas.dataset.portraitStamp=stamp;
 loadStudioImage('full-'+role).then(img=>{
  if(!canvas.isConnected||canvas.dataset.portraitStamp!==stamp)return;
  if(!jerseyCache.has(stamp)){
   if(jerseyCache.size>=10)jerseyCache.delete(jerseyCache.keys().next().value);
   jerseyCache.set(stamp,paintUniformKit(img,role,palette,items,number));
  }
  canvas.width=img.width;canvas.height=img.height;
  canvas.getContext('2d').drawImage(jerseyCache.get(stamp),0,0);
 }).catch(()=>{});
}
let arenaPlate=null;
function applyStudioTheme(){
 if(typeof Image!=='undefined')loadStudioImage('arena').then(img=>{arenaPlate=img;}).catch(()=>{});
 document.documentElement?.style.setProperty('--arena-art','url(data:image/webp;base64,'+studioArt.arena+')');
}
const kitSlots={
 goalie:['mask','glove','pads','skates'],
 skater:['helmet','visor','stick','skates','celebration']
};
function roleKitSlots(){
 return kitSlots[isGoalie()?'goalie':'skater'];
}
function equippedKit(){
 return roleKitSlots().map(slot=>gear.find(item=>item.id===career.equipped[slot]&&item.slot===slot)??gear.find(item=>item.slot===slot));
}
function kitItemLabel(item){
 return item.slot==='stick'&&item.id!=='wood'?(curves[career.stickCurves?.[item.id]]??curves.neutral).label:equipmentTabs[item.slot];
}
function kitDisplay(items,style='card-loadout'){
 return '<div class="player-kit '+style+'">'+items.map(item=>
  '<button type="button" class="kit-item" data-action="preview-gear" data-id="'+item.id+'" aria-label="Preview '+item.name+'">'+
  '<span class="kit-thumb">'+studioImage(item.id,'kit-image')+'</span><span class="kit-label"><small>'+kitItemLabel(item)+'</small><strong>'+item.name+'</strong></span></button>').join('')+'</div>';
}
function fullPlayerPhoto(layer,loading='eager'){
 const p=playerPalette();
 const role=isGoalie()?'goalie':'skater';
 return '<div class="full-player '+layer+'" style="--kit-club:'+p.color+'">'+studioImage('full-'+role,'full-player-fallback',loading)+
 '<canvas '+(layer==='fitting-photo'?'data-fitting-room':'data-player-photo')+' aria-hidden="true"></canvas></div>';
}

function applyPhotoRegion(ctx,region,color,opacity){
 if(!region)return;
 ctx.save();ctx.clip(new Path2D(region));
 ctx.globalCompositeOperation='color';ctx.globalAlpha=opacity;ctx.fillStyle=color;ctx.fillRect(0,0,1536,1024);
 ctx.restore();
}
function paintUniformKit(img,role,palette,items,number){
 const canvas=document.createElement('canvas');
 canvas.width=img.width;canvas.height=img.height;
 const ctx=canvas.getContext('2d');
 ctx.drawImage(img,0,0);
 ctx.save();ctx.scale(img.width/768,img.height/1024);
 if(role==='goalie')ctx.translate(-768,0);
 const region=kitRegions[role];
 applyPhotoRegion(ctx,region.jersey,palette.color,.83);
 applyPhotoRegion(ctx,region.trim,palette.accent,.75);
 for(const item of items){
  const finish=gearFinish[item.id];
  if(!finish||!region[item.slot])continue;
  applyPhotoRegion(ctx,region[item.slot],finish,item.slot==='visor' ? .42 : .91);
  if(gearLight[item.id]){
   ctx.save();ctx.clip(new Path2D(region[item.slot]));
   ctx.fillStyle=gearLight[item.id];ctx.fillRect(0,0,1536,1024);ctx.restore();
  }
  if(item.slot==='mask'&&maskDecorations[item.id]){
   ctx.save();ctx.clip(new Path2D(region.mask));ctx.globalAlpha=.70;
   const decal=maskDecorations[item.id];
   path(ctx,decal[0],decal[1],decal[2],5);ctx.restore();
  }
 }
 const center=role==='goalie'?1143:342;
 ctx.font='900 69px system-ui, sans-serif';
 ctx.textAlign='center';ctx.lineJoin='round';ctx.lineWidth=5;
 ctx.strokeStyle='#071323';ctx.fillStyle=palette.accent;ctx.globalAlpha=.90;
 ctx.strokeText(number,center,316);ctx.fillText(number,center,316);
 ctx.restore();
 return canvas;
}

function initAudio(){
 if(muted)return;
 try{audio??=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume().catch(()=>{});}catch{}
}
function sound(kind){
 if(muted)return;
 initAudio();
 if(!audio)return;
 const now=audio.currentTime;
 const tones=kind==='horn'?[[125,0,.65],[158,0,.65],[187,0,.65],[148,.73,.48],[187,.73,.48]]:kind==='puck'?[[180,0,.08]]:[[385,0,.11],[520,.09,.16]];
 for(const [freq,start,duration] of tones){
  const osc=audio.createOscillator(),amp=audio.createGain(),t=now+start;
  osc.type=kind==='horn'?'triangle':'sine';osc.frequency.value=freq;
  amp.gain.setValueAtTime(.001,t);amp.gain.exponentialRampToValueAtTime(kind==='horn'?.075:.11,t+.018);
  amp.gain.exponentialRampToValueAtTime(.001,t+duration);osc.connect(amp).connect(audio.destination);osc.start(t);osc.stop(t+duration);
 }
 if(kind==='horn'){
  const buffer=audio.createBuffer(1,audio.sampleRate,audio.sampleRate),values=buffer.getChannelData(0);
  for(let i=0;i<values.length;i++)values[i]=(Math.random()*2-1)*.25;
  const crowd=audio.createBufferSource(),amp=audio.createGain();crowd.buffer=buffer;amp.gain.setValueAtTime(.1,now);amp.gain.exponentialRampToValueAtTime(.001,now+1);crowd.connect(amp).connect(audio.destination);crowd.start();
 }
}
function skill(attr){

 },0);
}
function ratingXP(){
 return Math.max(0,career.xp-(career.proXPStart??0));
}
function ratingStep(){
 return career.year===0?180:ratingXP()<490?70:350;
}
function ratingProgress(){
 const step=ratingStep();
 const xp=ratingXP()-(career.year>0&&ratingXP()>=490?490:0);
 return {step,value:xp%step};
}
function overall(){
 const trained=Object.values(career.attrs).reduce((sum,v)=>sum+v,0);
 const xp=ratingXP();
 const growth=career.year===0?Math.floor(xp/180):Math.floor(Math.min(xp,490)/70)+Math.floor(Math.max(0,xp-490)/350);
 return career.year===0?clamp(65+growth+Math.floor(trained/4),65,74):clamp(75+growth+Math.floor(trained/4),75,99);
}

function nextOpponent(){
 if(career.phase==='playoffs'){
  const {pairs,index}=career.series;return pairs[index].ids.find(id=>id!==career.team);
 }
 if(career.phase==='junior'||career.phase==='regular'){
  return career.schedule[career.gp].find(pair=>pair.includes(career.team)).find(id=>id!==career.team);
 }
 return null;
}
function orderedTable(){return [...career.table].sort((a,b)=>(b.w*2+b.otl)-(a.w*2+a.otl)||(b.gf-b.ga)-(a.gf-a.ga)||a.id-b.id);}
function updateTable(a,b,sa,sb,extra,winning=a){
 const home=career.table[a],away=career.table[b];
 home.gf+=sa;home.ga+=sb;away.gf+=sb;away.ga+=sa;
 const won=winning===a?home:away,lost=winning===a?away:home;
 won.w++;lost[extra?'otl':'l']++;
}
function simulateRestOfRound(){
 const pairings=career.schedule[career.gp];
 for(const [a,b] of pairings){
  if(a===career.team||b===career.team)continue;
  const first=int(1,5),second=int(1,5),extra=first===second;
  const firstWins=extra?Math.random()<.5:first>second;
  updateTable(a,b,first+(extra&&firstWins?1:0),second+(extra&&!firstWins?1:0),extra,firstWins?a:b);
  if(career.phase==='regular'){
   recordClub('regular',a,first,second,firstWins,{seed:career.gp});
   recordClub('regular',b,second,first,!firstWins,{seed:career.gp});
  }
 }
}
function pair(k,l){return {ids:[k,l],wins:[0,0]};}
function setPlayoffRound(teamsInOrder,round){
 const pairs=[];
 for(let i=0;i<teamsInOrder.length/2;i++)pairs.push(pair(teamsInOrder[i],teamsInOrder.at(-i-1)));
 career.series={round,pairs,index:pairs.findIndex(x=>x.ids.includes(career.team)),completed:false};
}
function awardSeason(){
 const p=career.season,q=career.playoff,won=career.series?.completed&&career.series.round===2&&career.series.pairs[career.series.index].wins[career.series.pairs[career.series.index].ids.indexOf(career.team)]===2;
 const list=[];
 if(won){career.cups++;list.push('cup');}
 career.awardResults=raceIds.map(id=>{
  const winner=raceRanking(id,true)[0];
  if(!winner)return null;
  if(winner.id==='player')list.push(id);
  return {id,player:winner.id==='player',name:winner.name,team:winner.team,mark:raceMark(id,winner)};
 }).filter(Boolean);
 list.forEach(id=>career.medals[id]=(career.medals[id]??0)+1);
 career.yearAwards=list;career.bucks+=list.length*175;career.phase='awards';
 career.history.push({year:career.year,team:career.team,season:{...p},playoff:{...q},awards:list});
}
function advancePlayoffs(won){
 const series=career.series,own=series.pairs[series.index],playerSide=own.ids.indexOf(career.team);
 own.wins[won?playerSide:1-playerSide]++;
 for(const p of series.pairs){
  if(p===own||p.wins.includes(2))continue;
  playOtherSeriesGame(p);
 }
 if(!own.wins.includes(2))return;
 series.completed=true;
 const winners=series.pairs.map(p=>{
  while(!p.wins.includes(2))playOtherSeriesGame(p);
  return p.ids[p.wins.indexOf(2)];
 });
 if(own.wins[playerSide]<2||series.round===2){
  career.champion=finishUnplayedPlayoffs(winners,series.round+1);
  awardSeason();return;
 }
 setPlayoffRound(winners,series.round+1);
}
function advanceSchedule(won,extra,score,against){
 if(career.phase==='playoffs'){advancePlayoffs(won);return;}
 simulateRestOfRound();
 const opp=nextOpponent();
 updateTable(career.team,opp,score,against,extra,won?career.team:opp);career.gp++;
 if(career.phase==='junior'&&career.gp===10){career.phase='draft';return;}
 if(career.phase!=='regular'||career.gp<12)return;
 const seeded=orderedTable().slice(0,8).map(x=>x.id);
 if(seeded.includes(career.team)){career.phase='playoffs';setPlayoffRound(seeded,0);}
 else {career.champion=finishUnplayedPlayoffs(seeded,0);awardSeason();}
}

  if(key in career.attrs){career.attrs[key]+=value;continue;}
  career[key]=clamp(career[key]+value,0,key==='energy'||key==='chem'?100:Infinity);
 }
}

const slotKey=index=>storageKey+'-slot-'+index;
const pendingSaves=new Map();
let saveMessage='';
function storedSlot(index){
 const current=localStorage.getItem(slotKey(index));
 if(current!==null&&current!==undefined)return current;
 const old=JSON.parse(localStorage.getItem(storageKey)??'null');
 return JSON.stringify(old?.[index]??null);
}
const slotVersions=[null,null,null].map((_,index)=>{
 try{return storedSlot(index);}
 catch{storageOK=false;return 'null';}
});
let slots=slotVersions.map(raw=>{
 try{return JSON.parse(raw);}
 catch{return null;}
});
function refreshSlots(){
 if(!storageOK)return;
 try{
  for(let index=0;index<slots.length;index++){
   if(pendingSaves.has(index)||index===slot&&screen!=='slots')continue;
   const raw=storedSlot(index);
   slots[index]=JSON.parse(raw);slotVersions[index]=raw;
  }
 }catch{storageOK=false;}
}
function writeSlot(index,value){
 const previous=slotVersions[index],raw=JSON.stringify(value);
 slotVersions[index]=raw;slots[index]=value;
 const commit=()=>{
  try{
   if(storedSlot(index)!==previous){
    saveMessage='This career changed in another tab. The latest saved progress is in Careers.';
    return false;
   }
   localStorage.setItem(slotKey(index),raw);
   storageOK=true;saveMessage='';
  }catch{storageOK=false;}
  updateFooter();
  return true;
 };
 const recover=()=>{
  if(index===slot){slot=-1;career=null;}
  refreshSlots();
  if(slot<0)show('slots');else updateFooter();
 };
 const locks=globalThis.navigator?.locks;
 if(!locks){
  if(!commit())recover();
  return;
 }
 const write=locks.request(slotKey(index),commit).catch(commit);
 pendingSaves.set(index,write);
 write.then(ok=>{
  if(pendingSaves.get(index)!==write)return;
  pendingSaves.delete(index);
  if(!ok)recover();
 });
}
function persist(){
 if(career&&slot>=0)writeSlot(slot,career);
 else updateFooter();
}

function paintBroadcast(now=performance.now()){

 if(!c)return;

 const outcomeTime=outcome?clamp((now-outcome.at)/420,0,1):0;
 iceScene(c,outcome?.goal===true||!m&&match.lastGoal?.period===match.period);
 if(m?.challenge){paintCareerChallenge(c,m,now,outcome,own,opp);return;}
 if(!m){
  rinkSkater(c,475,235,.95,opp,true);
  rinkSkater(c,415,362,1.38,own,false,-.18);
  rinkSkater(c,590,306,1.13,opp,false,.16);
  rinkPuck(c,483,354);
  return;
 }
 const defending=isGoalie()||m.id==='block';
 const elapsed=Math.max(0,now-m.started);
 const fake=m.feint&&now>=m.started+230&&now<m.ready-160;
 const release=outcome||m.kind==='reaction'&&now>=m.ready;
 const lane=m.target;
 const widePlay=['pass','saucer','battle','duel'].includes(m.id);
 const boardPlay=m.id==='battle'||m.id==='duel';
 const approach=still?(release ? .9 : .55):clamp(elapsed/Math.max(420,m.ready-m.started),0,1);
 const attacker=defending?opp:own,keeper=defending?own:opp;
 const startX=boardPlay?765:fake?laneX[m.fake]:480;
 const shotX=widePlay?(boardPlay?695:laneX[lane]+125):laneX[lane];
 const shotY=widePlay?294:defending&&outcome&&!outcome.goal?226:199;
 const skaterX=boardPlay?760-approach*40:lerp(480,startX,approach);
 const skaterY=boardPlay?320:lerp(376,m.id==='point'||m.id==='scramble'?274:305,approach);
 const move=outcome?.moment.attempt??(outcome&&!outcome.goal?lane:1);
 const keeperX=outcome&&(defending||!outcome.success)?lerp(480,laneX[move],still?1:outcomeTime):480;
 if(m.id==='pass'){
  path(c,'M'+(shotX-28)+' 299q28-13 56 0-26 18-56 0Z','#f2cb687d','#aa7f2c',2);

 if((release||m.kind==='target')&&!widePlay){

const challengeTypes={
 crease:{title:'Breakaway Challenge',help:'Move with ← and →. Press Space to make the save when the puck comes off the stick.'},
 rebounds:{title:'Rebound Scramble',help:'Move with ← and →. Press Space to save, then slide across for the rebound.'},
 shot:{title:'Pick Your Shot',help:'Aim with ← and →. Press Space to shoot before the goalie gets across.'},
 rush:{title:'Two-on-One',help:'Press 1 to shoot or 2 to pass. If you pass, press Space as the puck reaches your teammate.'},
 boards:{title:'Win It on the Boards',help:'Press Space to shield the puck as the defender arrives. Then choose Drive or Dish.'}
};
const rolePlays={goalie:['crease','rebounds'],sniper:['shot'],playmaker:['rush'],power:['boards']};
const opponentStyles=['Quick release','Patient puck control','Net-front traffic'];
const laneNames=['Left','Middle','Right'];
const formatClock=seconds=>Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');

function chooseCareerSituation(){
 const gap=match.us-match.them,late=match.period===3;
 const pool=late?[
  ...(gap===1?[['protect','Protect the lead',44]]:[]),
  ...(gap===-1?[['chase',isGoalie()?'Keep it a one-goal game':'Extra attacker · One goal to tie',38]]:[]),
  ...(gap===0?[['level','Next goal takes the lead',52]]:[]),
  ['last','Final-minute rush',56]
 ]:[];
 pool.push(['special',isGoalie()?'Penalty kill':'Power play',584],['rush-hour','Odd-man rush',213],['pressure','Pressure shift',127]);
 const recent=[...(career.recentPlays??[]),...match.playHistory].slice(-4);
 const candidates=rolePlays[career.role].flatMap(type=>pool.map(context=>({type,context,key:type+'-'+context[0]})));
 const lastType=recent.at(-1)?.split('-')[0];
 const scored=candidates.map(c=>{
  const age=recent.lastIndexOf(c.key);
  return {c,value:(age===-1?5:-(age+1))+
   (c.type!==lastType?4:0)+(late&&c.context[2]<60?3:0)+
   (c.type==='rebounds'&&(c.context[0]==='special'||match.opp%3===2)?1:0)+Math.random()};
 });
 return scored.sort((a,b)=>b.value-a.value)[0].c;
}

function startCareerChallenge(situation){
 const {type,context}=situation;
 const style=match.opp%opponentStyles.length;
 const now=performance.now();
 const first=int(0,2),second=(first+int(1,2))%3;
 const opening=int(0,1)===0?0:2;
 const speed=style===0?-.25:style===1?.35:0;
 const practiceBonus=match.practice ? .95 : 0;
 const timingSkill=skill(type==='crease'||type==='rebounds'?'reflex':type==='shot'?'shoot':'sense');
 const bonus=clamp(timingSkill*.025,0,.75);
 match.moment={
  id:type,challenge:true,title:challengeTypes[type].title,scenario:context[0],context:context[1],clock:context[2],style,
  started:now,stepAt:now,phase:'opening',lane:1,fromLane:1,movedAt:now,
  target:first,fake:second,opening,defender:context[0]==='chase'&&type==='rush'?1:int(0,1),saves:0,shotNumber:1,
  cueAt:type==='crease'?3.1+speed:type==='rebounds'?2.5+speed:type==='boards'?2.6+speed:1.85+speed,
  window:(type==='rebounds'?1.9:2.5)+practiceBonus+bonus,choice:null
 };
 if(!match.practice){
  match.playHistory.push(situation.key);
  const clincher=career.phase==='playoffs'&&career.series.pairs[career.series.index].wins[
   career.series.pairs[career.series.index].ids.indexOf(match.team)]===1;
  if(context[0]==='special'){
   addFeed(match.tag,teams[isGoalie()?match.team:match.opp].code+' takes a minor penalty.');
  }else if(context[0]==='chase'&&!isGoalie()){
   addFeed(match.tag,teams[match.team].code+' pulls the goalie for an extra attacker.');
  }
  addFeed(match.tag,context[1]+' · '+formatClock(context[2])+' remaining. '+challengeTypes[type].title+'!'+(clincher?' Win tonight to take the series.':''));
 }
 render();
 app.querySelector('[data-action="challenge"]')?.focus({preventScroll:true});
 tickCareerChallenge();
}

function challengeState(m,now=performance.now()){
 const t=Math.max(0,(now-m.stepAt)/1000);
 if(m.phase==='one-timer'){
  if(t>=1.55+m.window)return {expired:true};
  return {t,ready:t>=1.55,text:t>=1.55?'One-time it now!':'Pass coming across…'};
 }
 if(m.phase==='puck-won'){
  if(t>=4+m.window)return {expired:true};
  return {t,ready:true,text:m.defender===0?'Defender covers your teammate.':'Defender comes at you.'};
 }
 if(m.id==='crease'||m.id==='rebounds'){
  if(t>=m.cueAt+m.window)return {expired:true};
  const fake=m.id==='crease'&&m.style!==0&&t>=m.cueAt-1.55&&t<m.cueAt-.5;
  const ready=t>=m.cueAt;
  return {t,fake,ready,text:ready?'Shot '+laneNames[m.target].toLowerCase()+'! Make the save.':fake?'Fake '+laneNames[m.fake].toLowerCase()+'! Watch the puck.':m.shotNumber>1?'Rebound! Find the puck.':'Shooter approaching…'};
 }
 if(m.id==='shot'){
  if(t>=8.5+(match.practice?2:0))return {expired:true};
  // The goalie moves across the crease and resets toward the middle.
  const beat=Math.floor(Math.max(0,t-m.cueAt)/(m.style===1?1.85:1.55))%3;
  const cover=t<m.cueAt?1:beat===0?m.opening:beat===1?2-m.opening:1;
  return {t,ready:true,cover,text:'Goalie covers '+laneNames[cover].toLowerCase()+' · Aim '+laneNames[m.lane].toLowerCase()};
 }
 if(m.id==='rush'){
  if(t>=m.cueAt+4.2+m.window)return {expired:true};
  return {t,ready:t>=m.cueAt,text:t<m.cueAt?'Watch the defender…':m.defender===0?'Defender stays in the passing lane.':'Defender steps up to challenge you.'};
 }
 if(t>=m.cueAt+m.window)return {expired:true};
 return {t,ready:t>=m.cueAt,text:t>=m.cueAt?'Defender is here. Shield now!':'Set your feet and wait for contact…'};
}

function tickCareerChallenge(){
 const m=match?.moment;
 if(screen!=='live'||!m?.challenge)return;
 const now=performance.now(),cue=challengeState(m,now);
 if(cue.expired){
  if(m.id==='crease'||m.id==='rebounds')finishGoalieShot(m,false,'The shot got through before you made a save.');
  else finishCareerChallenge(m,false,m.phase==='one-timer'?'The pass got away. Shoot as it reaches your teammate.':m.id==='shot'?'The goalie ran out the clock. Pick a side and shoot sooner.':'The defender recovered. Make your move sooner.');
  return;
 }
 const signal=app.querySelector('#challenge-signal');
 if(signal&&signal.textContent!==cue.text)signal.textContent=cue.text;
 const position=app.querySelector('#challenge-position');
 if(position)position.textContent=laneNames[m.lane];
 const clock=app.querySelector('#challenge-clock');
 if(clock)clock.textContent=formatClock(Math.max(0,m.clock-Math.floor((now-m.started)/1000)));
 const action=app.querySelector('.challenge-controls');
 if(action)action.dataset.ready=String(cue.ready);
 paintBroadcast(now);
 frame=requestAnimationFrame(tickCareerChallenge);
}

 (m.id==='rebounds'?'<p class="muted">Shot '+m.shotNumber+' of 3 · '+m.saves+' saved</p>':'')+
 ((m.id==='crease'||m.id==='shot'||m.id==='rebounds')?'<small class="muted">Your position · <strong id="challenge-position">'+laneNames[m.lane]+'</strong></small>':'')+

function challengeInput(input){
 const m=match?.moment;
 if(screen!=='live'||!m?.challenge)return;
 if(input==='exit'&&match.practice){show('training');return;}
 const now=performance.now(),cue=challengeState(m,now);
 if(cue.expired)return;
 const canMove=['crease','rebounds','shot'].includes(m.id);
 if((input==='left'||input==='right')&&canMove){
  const lane=clamp(m.lane+(input==='left'?-1:1),0,2);
  if(lane!==m.lane){m.fromLane=m.lane;m.lane=lane;m.movedAt=now;}
  return;
 }
 if(m.id==='crease'||m.id==='rebounds'){
  if(input!=='space')return;
  const saved=cue.ready&&m.lane===m.target;
  const reason=saved?'You read the shot and sealed the '+laneNames[m.target].toLowerCase()+' lane.':
   !cue.ready?'You committed before the release. Wait until the puck leaves the stick.':
   'The shooter went '+laneNames[m.target].toLowerCase()+'. Slide across before you make the save.';
  finishGoalieShot(m,saved,reason);return;
 }
 if(m.id==='shot'){
  if(input!=='space')return;
  m.coverAtRelease=cue.cover;
  const scored=m.lane!==cue.cover;
  finishCareerChallenge(m,scored,scored?'You picked a corner the goalie left open.':'The goalie already covered that lane. Try the other side.','goal');return;
 }
 if(m.phase==='one-timer'){
  if(input!=='space')return;
  finishCareerChallenge(m,cue.ready,cue.ready?'You set up the goal with a pass and a clean one-timer.':'You swung before the puck arrived. Wait for the pass.','assist');return;
 }
 if(m.phase==='puck-won'){
  if(!['one','two'].includes(input))return;
  m.choice=input;
  const scored=input===(m.defender===0?'one':'two');
  finishCareerChallenge(m,scored,scored?(input==='one'?'You won the puck and took it to the net.':'You drew the defender in and set up a teammate.'):
   'The defender covered your route. Try the other option.',input==='one'?'goal':'assist');return;
 }
 if(m.id==='rush'){
  if(!['one','two'].includes(input))return;
  m.choice=input;
  if(!cue.ready){finishCareerChallenge(m,false,'You made your choice before the defender committed. Give the play a moment.');return;}
  if(input==='one'){
   finishCareerChallenge(m,m.defender===0,m.defender===0?'The defender took away the pass, so you scored on the open shot.':'The defender rushed the puck. Your teammate had the open lane.','goal');
  }else if(m.defender===0)finishCareerChallenge(m,false,'The defender stayed in the passing lane and intercepted it.');
  else advanceChallengeStage(m,'one-timer',now);
  return;
 }
 if(input!=='space')return;
 if(!cue.ready){finishCareerChallenge(m,false,'You turned to shield too early. Wait until the defender reaches you.');return;}
 advanceChallengeStage(m,'puck-won',now);
}

function advanceChallengeStage(m,phase,now){
 cancelAnimationFrame(frame);
 m.phase=phase;m.stepAt=now;
 sound('puck');render();
 app.querySelector('[data-action="challenge"]')?.focus({preventScroll:true});
 tickCareerChallenge();
}

function finishGoalieShot(m,saved,reason){
 if(saved){match.line.sv++;m.saves++;}
 else addGoal('them');
 if(saved&&m.id==='rebounds'&&m.shotNumber<3){
  cancelAnimationFrame(frame);match.moment=null;
  const nextTarget=m.shotNumber===1?(m.target+int(1,2))%3:2-m.target;
  showMomentResult(m,true,'Save · Rebound loose',false,()=>{
   const now=performance.now();
   match.moment={...m,shotNumber:m.shotNumber+1,target:nextTarget===m.target?0:nextTarget,stepAt:now,cueAt:1.9,phase:'rebound'};
   render();app.querySelector('[data-action="challenge"]')?.focus({preventScroll:true});tickCareerChallenge();
  });

function recordClub(phase,id,goals,against,won,{seed,player,seconds=3600,skipGoalie=false}){

 const dice=(salt)=>((Math.imul((id+3)*37+(seed+7)*103+salt*7919+career.year*1831,213737))>>>8)%100;
 const skater=club[0].line,goalie=club[1].line,rookie=club[2].line;
 const budget=Math.max(0,goals-(player?.g??0));
 for(let goal=0;goal<budget;goal++){
  const roll=dice(11+goal*5);
  if(roll<29){skater.g++;}
  else if(roll<46){rookie.g++;}
 }
 for(let goal=0;goal<goals;goal++){
  const roll=dice(31+goal*7);
  if(roll<31)skater.a++;
  else if(roll<54)rookie.a++;
 }
 skater.gp++;rookie.gp++;
 if(skipGoalie||player&&isGoalie())return;
 goalie.gp++;goalie.w+=Number(won);goalie.ga+=against;goalie.so+=Number(against===0);goalie.seconds+=seconds;

}

  const shown=rows.slice(0,3);
  const me=rows.findIndex(x=>x.id==='player');
  if(me>=3)shown.push(rows[me]);
  content+='<article class="panel"><h3>'+awards[id][0]+'</h3><ol class="race-list">'+shown.map((r,i)=>'<li value="'+(i===3?me+1:i+1)+'" class="'+(r.id==='player'?'gold-text':'')+'"><div class="race-row"><span>'+escapeHTML(r.name)+' · '+teams[r.team].code+'</span><strong>'+raceMark(id,r)+'</strong></div></li>').join('')+'</ol></article>';
 }
 return '<section class="stack">'+heading('League leaders','Award Races','Golden Shot goes to the goals leader, Scoring Crown to the points leader, and Vezina to the eligible goalie with the best save percentage. MVP races consider scoring or goaltending impact.')+(career.races?.scoredFrom?'<p class="muted">Rival regular-season totals from before this update are estimated from team standings. Rival playoff game logs begin with the update.</p>':'')+(content?'<div class="grid race-grid">'+content+'</div>':'<p class="muted">The award races begin with the first pro game.</p>')+'</section>';
}
function awardResultsView(){
 const cup=career.champion!==null&&career.champion!==undefined?[{id:'cup',name:teamName(career.champion),team:career.champion,player:career.champion===career.team,mark:'League champion'}]:[];
 const current=career.awardResults?cup.concat(career.awardResults):career.yearAwards.map(id=>({id,player:true,name:id==='cup'?teamName(career.team):career.name,team:career.team,mark:''}));
 return '<section class="stack">'+heading('Northstar awards broadcast','Awards Night',career.yearAwards.includes('cup')?'Northstar Cup champions!':'Season '+career.year+' · '+teamName(career.team))+
 (current.length?'<div class="grid">'+current.map(({id,name,team,mark,player})=>'<article class="panel award-card '+(player?'you-won':'')+'"><div class="row spread"><span class="trophy" aria-hidden="true">'+awards[id][1]+'</span>'+crest(team)+'</div><h3>'+awards[id][0]+'</h3><p>'+escapeHTML(name)+(player&&id!=='cup'?' · You':'')+'</p>'+(mark?'<small class="muted">'+mark+'</small>':'')+'</article>').join('')+'</div>':'<p class="muted">No personal awards were recorded for this season.</p>')+
 (career.yearAwards.length?'<p class="gold-text">Award bonus · +'+currency(175*career.yearAwards.length)+' Puck Bucks</p>':'')+'<div>'+btn('contracts','Continue to contracts','gold')+'</div></section>';
}
let previewGear=null;
const equipmentTabs={
 pads:'Pads',glove:'Catch gloves',mask:'Goalie masks',skates:'Skates',stick:'Sticks',visor:'Visors',helmet:'Helmets',celebration:'Celebrations'
};
let gearTab='all';
function gearArt(id){return '<div class="equipment-art">'+studioImage(id,'gear-art')+'</div>';}
function paintFittingRoom(canvas){
 const current=playerPalette(),form=app.querySelector('#jersey-form');
 const tone={...current,color:hexColor(form?.elements.primary.value,current.color),accent:hexColor(form?.elements.trim.value,current.accent)};
 paintPlayerPhoto(canvas,tone,gear.find(item=>item.id===previewGear));
}
function purchaseGearButton(item){
 const owned=career.owned.includes(item.id),equipped=career.equipped[item.slot]===item.id;
 return btn('gear',equipped?'Equipped':owned?'Equip':'Buy &amp; equip',equipped?'quiet':'gold','data-id="'+item.id+'"',equipped||!owned&&career.bucks<item.cost);
}
function fittingRoom(){
 const item=gear.find(g=>g.id===previewGear);
 const photo=fullPlayerPhoto('fitting-photo');
 const control='<div class="fitting-kit stack"><div><p class="eyebrow">'+(item?'Equipment preview':'Jersey fitting')+'</p><h3>'+(item?item.name:playerName())+'</h3></div>'+
 (item?'<p class="muted">'+(item.boost?'+'+item.boost+' '+statName[item.attr]:'Goal celebration')+'</p>'+
 '<p class="gear-price">'+(career.owned.includes(item.id)?'Owned':currency(item.cost)+' Puck Bucks')+'</p><div class="row">'+purchaseGearButton(item)+btn('clear-gear-preview','Back to jersey fitting','quiet')+'</div>':jerseyControls())+'</div>';
 return '<section id="fitting-room" class="panel fitting-room studio-fitting '+(item?'has-preview':'')+'" tabindex="-1">'+photo+
 (item?'<div class="fitting-product">'+(item.slot==='celebration'?celebrationView(item.id):gearArt(item.id))+'</div>':'')+control+'</section>';
}
function beginPro(team,salary){
 if(career.year===0)career.proXPStart=career.xp;
 career.team=team;career.salary=salary;career.year++;career.phase='regular';career.energy=100;career.hype=0;
 resetSeason(career);unlockRanks();persist();show('hub');
}
function applyEvent(i){
 if(career.event===null)return;
 const e=events[career.event],effect=e[i?5:3];
 if((effect.bucks??0)<-career.bucks)return;
 applyEffects(effect);career.event=null;unlockRanks();persist();feedback(i?e[4]:e[2]);
}
function buyGear(id){
 const g=gear.find(item=>item.id===id);
 const owns=career.owned.includes(g.id);
 if(career.equipped[g.slot]===id||!owns&&career.bucks<g.cost)return;
 if(!owns){career.owned.push(id);career.bucks-=g.cost;}
 career.equipped[g.slot]=id;persist();feedback(g.name+' equipped.');
}
function startQuiz(){
 if(career.quizGame===career.games)return;
 if(!career.quizOrder.length)career.quizOrder=shuffle(trivia.map((_,i)=>i));
 const id=career.quizOrder.shift();
 quiz={id,answers:shuffle(trivia[id].slice(1)),done:false};
 show('quiz');
}
function saveAnswer(i){
 if(quiz.done)return;
 quiz.done=true;career.quizGame=career.games;quiz.correct=quiz.answers[i]===trivia[quiz.id][1];
 if(quiz.correct){applyEffects({xp:45,chem:4});sound('cheer');}
 unlockRanks();persist();render();
}
function revealDraft(){
 if(career.draftTeam!==undefined)return;
 const talent=career.junior.w>=5||career.junior.g+career.junior.a>=8;
 const pool=teams.filter(t=>t.id!==career.preference);
 career.draftTeam=talent||career.junior.gp===0||Math.random()<.65?career.preference:pool[int(0,pool.length-1)].id;
 persist();sound('cheer');render();
}
const actions={
 mute(){
  muted=!muted;saveSound();
  const button=document.querySelector('[data-action="mute"]');
  button.textContent=muted?'Sound off':'Sound on';button.setAttribute('aria-pressed',String(!muted));
  if(!muted) sound('cheer');
 },
 slots(){slot=-1;career=null;refreshSlots();show('slots');},
 new({index}){
  refreshSlots();
  if(slots[index]){show('slots');return;}
  slot=Number(index);show('create');app.querySelector('[name="name"]')?.focus();
 },
 resume({index}){
  refreshSlots();
  if(!slots[index]){show('slots');return;}
  slot=Number(index);career=slots[slot];
  if(career.year>0)ensureRaces();
  show('hub');
 },
 delete({index}){
  if(window.confirm('Delete the career for '+slots[index].name+'? This cannot be undone.')){
   writeSlot(Number(index),null);show('slots');
  }
 },
 view({id}){if(id==='shop'){previewGear=null;gearTab='all';}show(id);},
 'gear-filter'({id}){gearTab=id;render();app.querySelector('[data-action="gear-filter"][aria-pressed="true"]')?.focus({preventScroll:true});},
 'preview-gear'({id}){
  const item=gear.find(item=>item.id===id&&roleKitSlots().includes(item.slot));
  if(!item)return;
  previewGear=id;
  if(screen!=='shop'){gearTab=item.slot;show('shop');}else render();
  app.querySelector('#fitting-room')?.focus();
 },
 'clear-gear-preview'(){previewGear=null;render();app.querySelector('#fitting-room')?.focus();},
 next(){show(['draft','awards','contract'].includes(career.phase)?career.phase:career.phase==='free'?'contract':'pre');},
 rest(){career.energy=clamp(career.energy+30,0,100);persist();feedback('Energy restored.');},
 event({index}){applyEvent(Number(index));},
 gear({id}){buyGear(id);},
 curve({id}){
  if(isGoalie()||career.equipped.stick==='wood'||!Object.hasOwn(curves,id))return;
  career.stickCurves??={};career.stickCurves[career.equipped.stick]=id;
  persist();feedback(curves[id].label+' equipped.');
 },
 'team-colors'(){delete career.jersey;persist();feedback('Team colours restored.');},
 drill({id}){if(career.energy>=12)startDrill(id);},
 'drill-key'({index}){playDrill(Number(index));},
 'quit-drill'(){finishDrill();},
 quiz(){startQuiz();},
 answer({index}){saveAnswer(Number(index));},
 'locker-up'(){
  const cost=lockerCosts[career.locker];if(cost===undefined||career.bucks<cost)return;
  career.bucks-=cost;career.locker++;persist();feedback('Locker room upgraded.');
 },
 poster({id}){if(career.posters.includes(id)){career.poster=id;persist();feedback(posters[id]+' is on display.');}},
 'reveal-draft'(){revealDraft();},
 'sign-rookie'(){if(career.year===0&&career.draftTeam!==undefined){unlock('rookie');if(isGoalie())unlock('goalie');beginPro(career.draftTeam,140);}},
 contracts(){career.phase='contract';persist();show('contract');},
 hometown(){applyEffects({chem:15});beginPro(career.team,160);},
 bigbag(){applyEffects({chem:-7});beginPro(career.team,260);},
 free(){career.phase='free';career.offers??=shuffle(teams.filter(t=>t.id!==career.team).map(t=>t.id)).slice(0,3);persist();show('contract');},
 'cancel-free'(){career.phase='contract';persist();show('contract');},
 sign({index}){
  if(!career.offers.includes(Number(index)))return;
  career.chem=50;delete career.offers;beginPro(Number(index),220);
 },
 'start-match'({id}){startMatch(id);},
 'practice-challenge'({id}){startChallengePractice(id);},
 challenge({id}){challengeInput(id);},
 'fast-game'(){
  clearTimeout(timer);
  if(match.nextBeat){advanceBroadcast();return;}
  if(match.shootout){startShootout();return;}
  if(match.mode==='sim'){while(screen==='live'&&!match.settled){advanceGame();clearTimeout(timer);}}
  else advanceGame();
 },
 moment({index}){playMoment(Number(index));}
};
document.addEventListener('click',event=>{
 const button=event.target.closest('button[data-action]');
 if(!button||button.disabled)return;
 notice='';actions[button.dataset.action]?.(button.dataset);
});
app.addEventListener('input',event=>{
 if(event.target.form?.id==='jersey-form'){
  const canvas=app.querySelector('[data-fitting-room]');
  if(canvas)paintFittingRoom(canvas);
 }
});
app.addEventListener('submit',event=>{
 if(event.target.id==='jersey-form'){
  event.preventDefault();
  const data=new FormData(event.target),t=teams[career.team];
  career.jersey={primary:hexColor(data.get('primary'),t.color),trim:hexColor(data.get('trim'),t.accent)};
  persist();feedback('Jersey colours updated.');
  return;
 }
 if(event.target.id!=='player-form')return;
 event.preventDefault();
 const values=Object.fromEntries(new FormData(event.target));
 if(!values.name.trim()){
  const input=event.target.elements.name;
  input.setCustomValidity('Enter a player name.');input.reportValidity();
  input.addEventListener('input',()=>input.setCustomValidity(''),{once:true});
  return;
 }
 career=createCareer(values);persist();show(career?'hub':'slots');
});
document.addEventListener('keydown',event=>{
 if(event.altKey||event.ctrlKey||event.metaKey||event.repeat)return;
 const m=screen==='live'?match?.moment:null;
 if(!m&&screen!=='drill')return;
 const key=event.key;
 if(m?.challenge){
  const control={ArrowLeft:'left',ArrowRight:'right',' ':'space','1':'one','2':'two',Escape:'exit'}[key];
  if(control){event.preventDefault();challengeInput(control);}
  return;
 }
 let index={'1':0,'2':1,'3':2}[key];
 if(screen==='drill'&&key==='ArrowLeft')index=0;
 if(screen==='drill'&&key==='ArrowRight')index=['skate','glove','blocker','post'].includes(drill.id)?1:2;
 if(key===' '&&(m&&['timing','mash'].includes(m.kind)||screen==='drill'&&drill.id==='angle'))index=1;
 if(index===undefined)return;
 event.preventDefault();
 if(screen==='drill')playDrill(index);else playMoment(index);
});
window.addEventListener?.('storage',event=>{
 if(screen==='slots'&&(event.key===null||event.key===storageKey||event.key?.startsWith(storageKey+'-slot-'))){
  refreshSlots();render();
 }
});
applyStudioTheme();
render();
</script>
</body>
</html>
